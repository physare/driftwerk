name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target Driftwerk_VST3 Driftwerk_Standalone --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/Driftwerk_artefacts/Release/VST3/Driftwerk.vst3 dist/
          Copy-Item build/Driftwerk_artefacts/Release/Standalone/Driftwerk.exe dist/
      - uses: actions/upload-artifact@v4
        with:
          name: Driftwerk-Windows
          path: dist
