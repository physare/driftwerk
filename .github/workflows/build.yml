name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -A x64
      - name: Build VST3 + Standalone
        run: cmake --build build --config Release --target Timewind_VST3 Timewind_Standalone --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse build/Timewind_artefacts/Release/VST3/Timewind.vst3 dist/
          Copy-Item build/Timewind_artefacts/Release/Standalone/Timewind.exe dist/
          Copy-Item tools/windows/update-timewind.ps1 dist/
          Copy-Item tools/windows/install-timewind.ps1 dist/
          Set-Content -NoNewline -Path version.txt -Value "$env:GITHUB_SHA"
          Compress-Archive -Path dist/* -DestinationPath Timewind-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Timewind-Windows
          path: dist
      # Rolling "latest" release that the Windows auto-updater pulls from.
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes 2>$null
          $msg = (git log -1 --pretty=%s)
          gh release create latest Timewind-Windows.zip version.txt --target $env:GITHUB_SHA --title "Latest build" --notes "Built from $env:GITHUB_SHA`n`n$msg" --prerelease
